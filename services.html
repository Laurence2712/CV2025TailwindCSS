  <style>
    /* ── Services page layout ── */
    .sv-page { min-height: 100vh; background: var(--bg); }

    .sv-grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 40px 80px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .sv-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: border-color .2s, transform .2s;
    }
    .sv-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .sv-card-num {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .15em;
      color: var(--accent);
      opacity: .7;
    }

    .sv-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }

    .sv-card-desc {
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.7;
      flex: 1;
    }

    .sv-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .sv-card-tags span {
      font-size: .62rem;
      font-weight: 600;
      letter-spacing: .05em;
      color: var(--accent);
      background: rgba(78,125,166,.08);
      border: 1px solid rgba(78,125,166,.2);
      border-radius: 100px;
      padding: 3px 10px;
    }

    /* ── Process section ── */
    .sv-process {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 40px 80px;
    }

    .sv-section-label {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .18em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 12px;
      opacity: .8;
    }

    .sv-section-title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .sv-section-sub {
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 48px;
    }

    .sv-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .sv-step {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sv-step-num {
      font-size: 2rem;
      font-weight: 900;
      color: var(--border);
      line-height: 1;
    }

    .sv-step-title {
      font-size: .9rem;
      font-weight: 700;
      color: var(--text);
    }

    .sv-step-desc {
      font-size: .74rem;
      color: var(--muted);
      line-height: 1.65;
    }

    /* ── CTA section ── */
    .sv-cta {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 40px 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      border-top: 1px solid var(--border);
      padding-top: 56px;
    }

    .sv-cta-text { display: flex; flex-direction: column; gap: 4px; }

    .sv-cta-title {
      font-size: clamp(1.2rem, 2.5vw, 1.7rem);
      font-weight: 700;
      color: var(--text);
    }

    .sv-cta-sub {
      font-size: .82rem;
      color: var(--muted);
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .sv-grid { grid-template-columns: 1fr; padding: 0 24px 60px; }
      .sv-steps { grid-template-columns: 1fr 1fr; }
      .sv-process { padding: 0 24px 60px; }
      .sv-cta { padding: 48px 24px 80px; flex-direction: column; align-items: flex-start; }
    }

    @media (max-width: 640px) {
      .sv-grid { padding: 0 20px 48px; gap: 16px; }
      .sv-card { padding: 28px 22px; }
      .sv-steps { grid-template-columns: 1fr; gap: 32px; }
      .sv-process { padding: 0 20px 48px; }
      .sv-cta { padding: 40px 20px 72px; }
    }
  </style>
</head>
