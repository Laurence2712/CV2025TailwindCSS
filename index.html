      </div>

        <span class="rl" data-translate="hero.location"></span>
      </div>
    </div>

        </div>
      </div>
      <div class="hero-portrait">
        <img src="uploads/image_portfolio.webp" alt="Laurence Pirard"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <div class="pp" style="display:none;">
          <span>LP</span>
          <p>Photo</p>

    </div>


    <div class="hero-footer reveal-group">
